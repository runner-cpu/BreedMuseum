<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="三江源高原牧场插画">
  <title>三江源高原牧场插画</title>
  <desc>项目原创矢量插画：雪山、高原草甸、河流源头与牦牛剪影，用作首页沉浸式背景。版权归项目所有。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="42%" stop-color="#0d1c2e"/>
      <stop offset="72%" stop-color="#2a3a4c"/>
      <stop offset="100%" stop-color="#4a4436"/>
    </linearGradient>
    <radialGradient id="dawn" cx="0.68" cy="0.52" r="0.46">
      <stop offset="0%" stop-color="#f0b96a" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#c8843f" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#c8843f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="snowFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fa7c4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2b3b4f" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="snowMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8c9dd" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#22303f" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16222f"/>
      <stop offset="100%" stop-color="#0a1119"/>
    </linearGradient>
    <linearGradient id="meadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#243020"/>
      <stop offset="55%" stop-color="#141c14"/>
      <stop offset="100%" stop-color="#080c08"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cfe0ef" stop-opacity="0.05"/>
      <stop offset="55%" stop-color="#dce9f4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f2d9a6" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

